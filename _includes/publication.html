<section class="twelve columns" id="publication">
    <h1>Publication</h1>
    <article>
        <ul>
            {% for pub in site.data.publications %}
            <li>
                <header>
                    <p><em>{{ pub.title }}</em></p>
                    <span>{{ pub.authors }}</span>
                </header>
                <p><em>{{ pub.details }}</em></p>
            </li>
            {% endfor %}
        </ul>
    </article>
</section>
