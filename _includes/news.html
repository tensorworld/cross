<section class="twelve columns" id="news">
  <h1>News</h1>
  <article>
    <ul>
      {% assign news_items = site.news | sort: 'date' | reverse %}
      {% for item in news_items %}
        <li>{{ item.content | markdownify | strip | replace: '<p>', '' | replace: '</p>', '' }}</li>
      {% endfor %}
    </ul>
  </article>
</section>
