<section class="twelve columns" id="activities">
  <h1>Activities</h1>
  <article>
    <ul>
      {% assign activities = site.activities | sort: 'date' | reverse %}
      {% for activity in activities %}
        <li>{{ activity.content | markdownify | strip | replace: '<p>', '' | replace: '</p>', '' }}</li>
      {% endfor %}
    </ul>
  </article>
</section>
